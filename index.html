    <style>
        h1 {
            text-decoration: overline;
            text-shadow: 2px 2px pink;

        h2 {
            font-style: oblique;

        }

            text-decoration: underline;
            text-align: right;
        }
        div {
            width: 500px;
            height: 160px;
            padding: 5px;
            background-color: white;
            box-shadow: 0px 0px 30px gray;
        }
    </style>
</head>
<body>
    <div>
        <h1>This is heading 1</h1>

        <h2>This is heading 2</h2>

        <h3>This is heading 3</h3>
    </div>
